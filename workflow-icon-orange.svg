<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 256 256"
  fill="none"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Workflow</title>
  <desc id="desc">An orange gradient workflow icon with one input branching into two outputs.</desc>

  <defs>
    <linearGradient
      id="workflow-gradient"
      x1="58"
      y1="35"
      x2="188"
      y2="218"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFB171" />
      <stop offset="0.42" stop-color="#FF7A32" />
      <stop offset="1" stop-color="#FF4800" />
    </linearGradient>

    <linearGradient
      id="workflow-highlight"
      x1="62"
      y1="42"
      x2="158"
      y2="174"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#FFFFFF" stop-opacity="0.58" />
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter
      id="soft-shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#D63D00" flood-opacity="0.2" />
    </filter>

    <mask id="workflow-shape" maskUnits="userSpaceOnUse" x="25" y="39" width="207" height="178">
      <rect x="25" y="39" width="207" height="178" fill="black" />

      <!-- Input node -->
      <rect x="29" y="97" width="62" height="62" rx="17" fill="white" />
      <rect x="42" y="110" width="36" height="36" rx="8" fill="black" />

      <!-- Rounded branch and stems -->
      <path
        d="M87 128H104C118.36 128 130 116.36 130 102V97C130 87.06 138.06 79 148 79H162"
        stroke="white"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M87 128H104C118.36 128 130 139.64 130 154V159C130 168.94 138.06 177 148 177H162"
        stroke="white"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Output nodes -->
      <rect x="157" y="43" width="72" height="72" rx="19" fill="white" />
      <rect x="171" y="57" width="44" height="44" rx="10" fill="black" />
      <rect x="157" y="141" width="72" height="72" rx="19" fill="white" />
      <rect x="171" y="155" width="44" height="44" rx="10" fill="black" />
    </mask>
  </defs>

  <g filter="url(#soft-shadow)">
    <rect
      x="25"
      y="39"
      width="207"
      height="178"
      fill="url(#workflow-gradient)"
      mask="url(#workflow-shape)"
    />

    <!-- Soft upper-left gleam, clipped to the workflow silhouette -->
    <rect
      x="25"
      y="39"
      width="207"
      height="178"
      fill="url(#workflow-highlight)"
      mask="url(#workflow-shape)"
    />
  </g>
</svg>

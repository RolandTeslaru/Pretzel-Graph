server {
    listen 80;

    # The router owns the URL space, so anything that is not a file is the app.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api        { proxy_pass http://backend:3001; include /etc/nginx/proxy.conf; }
    location /webhook    { proxy_pass http://backend:3001; include /etc/nginx/proxy.conf; }
    location /webhook-test { proxy_pass http://backend:3001; include /etc/nginx/proxy.conf; }

    location /socket {
        proxy_pass http://backend:3001;
        include /etc/nginx/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

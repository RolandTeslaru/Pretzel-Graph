# Two ways to run this:
#
#   docker compose up -d                          everything, served at localhost:8080
#   docker compose up -d postgres redis gotrue    stateful services only; run the
#                                                 packages on the host with npm run dev
#
# The defaults below are for a local machine. `down -v` deletes the volumes,
# generated keys included.

services:

  # Generates the keys the backend and worker share, once, into volumes.
  keys:
    image: alpine:3
    restart: "no"
    volumes:
      - shared-keys:/keys/shared
      - backend-keys:/keys/backend
    command:
      - sh
      - -c
      - |
        generate() { [ -s "$$1" ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$1"; }
        generate /keys/shared/encryption-key
        generate /keys/shared/worker-token
        generate /keys/backend/signing-key

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pretzel}
      POSTGRES_DB: ${POSTGRES_DB:-pretzel}
      GOTRUE_DB_NAME: ${GOTRUE_DB_NAME:-gotrue}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pretzel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotrue:
    image: supabase/auth:v2.177.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-http://localhost:9999}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pretzel}@postgres:5432/${GOTRUE_DB_NAME:-gotrue}?sslmode=disable&search_path=auth

      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:8080}
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-dev-jwt-secret-change-me-0123456789abcdef}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      # No mail server in development: accounts are usable immediately.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    ports:
      - "${GOTRUE_PORT:-9999}:9999"

  backend:
    image: ghcr.io/rolandteslaru/pretzelgraph-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared-keys:/keys/shared:ro
      - backend-keys:/keys/backend:ro
    # Keys set in .env win; otherwise the generated ones are used.
    command:
      - sh
      - -c
      - |
        export PRETZEL_ENCRYPTION_KEY="$${PRETZEL_ENCRYPTION_KEY:-$$(cat /keys/shared/encryption-key)}"
        export WORKER_SERVICE_INTERNAL_TOKEN="$${WORKER_SERVICE_INTERNAL_TOKEN:-$$(cat /keys/shared/worker-token)}"
        export EXECUTION_TOKEN_SIGNING_KEY="$${EXECUTION_TOKEN_SIGNING_KEY:-$$(cat /keys/backend/signing-key)}"
        exec ./entrypoint.sh
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pretzel}@postgres:5432/${POSTGRES_DB:-pretzel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_URL: http://gotrue:9999
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-jwt-secret-change-me-0123456789abcdef}
      PRETZEL_ENCRYPTION_KEY: ${PRETZEL_ENCRYPTION_KEY:-}
      EXECUTION_TOKEN_SIGNING_KEY: ${EXECUTION_TOKEN_SIGNING_KEY:-}
      WORKER_SERVICE_INTERNAL_TOKEN: ${WORKER_SERVICE_INTERNAL_TOKEN:-}
      CORS_ORIGIN: ${APP_URL:-http://localhost:8080}
      # Builds the OAuth redirect URI a provider console must list.
      PUBLIC_BASE_URL: ${APP_URL:-http://localhost:8080}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-}
      PORT: 3001
      # Handed to the page at runtime; the browser reaches the issuer here.
      PUBLIC_AUTH_URL: ${GOTRUE_EXTERNAL_URL:-http://localhost:9999}
      # Base address for the sidebar link back. Empty leaves the link out.
      PUBLIC_CLOUD_PORTAL_URL: ${PUBLIC_CLOUD_PORTAL_URL:-}
      # The Pretzel Cloud API. Set empty to turn it off.
      PRETZEL_CLOUD_URL: ${PRETZEL_CLOUD_URL-https://api.pretzelgraph.ai}
    ports:
      - "${APP_PORT:-8080}:3001"

  worker:
    image: ghcr.io/rolandteslaru/pretzelgraph-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - shared-keys:/keys/shared:ro
    command:
      - sh
      - -c
      - |
        export PRETZEL_ENCRYPTION_KEY="$${PRETZEL_ENCRYPTION_KEY:-$$(cat /keys/shared/encryption-key)}"
        export WORKER_SERVICE_INTERNAL_TOKEN="$${WORKER_SERVICE_INTERNAL_TOKEN:-$$(cat /keys/shared/worker-token)}"
        exec ./entrypoint.sh
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: http://backend:3001
      PRETZEL_ENCRYPTION_KEY: ${PRETZEL_ENCRYPTION_KEY:-}
      WORKER_SERVICE_INTERNAL_TOKEN: ${WORKER_SERVICE_INTERNAL_TOKEN:-}

volumes:
  postgres-data:
  redis-data:
  shared-keys:
  backend-keys:

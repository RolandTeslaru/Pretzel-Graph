# Publishes the release images. Pushing to the release branch builds each role
# and publishes it to GHCR, where self-hosted deployments pull from.
name: release

on:
  push:
    branches: [latest]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [combined, backend, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pretzelgraph-${{ matrix.role }}:${{ github.sha }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment pipeline
        run: |
          curl -sS -X POST "https://api.github.com/repos/${{ github.repository_owner }}/PretzelCloud/dispatches" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"sha\":\"${{ github.sha }}\",\"owner\":\"${{ github.repository_owner }}\"}}"

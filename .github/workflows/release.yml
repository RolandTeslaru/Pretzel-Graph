# Publishes the release images. Pushing to the release branch builds each role
# and publishes it to GHCR, where self-hosted deployments pull from.
name: release

on:
  push:
    branches: [latest]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [combined, backend, worker]
    steps:
      - uses: actions/checkout@v4

      # Registries demand lowercase; the account name is not.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/pretzelgraph-${{ matrix.role }}:${{ github.sha }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version this push publishes, as the manifest declares it.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [ -n "$VERSION" ] && [ "$VERSION" != "undefined" ] || { echo "package.json declares no version" >&2; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Notify deployment pipeline
        run: |
          curl -sS -X POST "https://api.github.com/repos/${{ github.repository_owner }}/PretzelCloud/dispatches" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"sha\":\"${{ github.sha }}\",\"owner\":\"${{ github.repository_owner }}\",\"version\":\"${{ steps.version.outputs.value }}\"}}"

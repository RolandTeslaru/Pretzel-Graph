# Publishes the release images. Pushing to the release branch builds each role
# and publishes it to GHCR, where self-hosted deployments pull from.
name: release

on:
  push:
    branches: [latest]

permissions:
  contents: read
  packages: write

jobs:
  # Each role and architecture builds on its own native runner and pushes by digest.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { role: combined, arch: amd64, runner: ubuntu-latest }
          - { role: backend,  arch: amd64, runner: ubuntu-latest }
          - { role: backend,  arch: arm64, runner: ubuntu-24.04-arm }
          - { role: worker,   arch: amd64, runner: ubuntu-latest }
          - { role: worker,   arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      # Registries demand lowercase; the account name is not.
      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/pretzelgraph-${{ matrix.role }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.role }}-${{ matrix.arch }},mode=max

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.role }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Joins each role's architectures into one image tagged with the commit, the version, and latest.
  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [combined, backend, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Read the version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.role }}-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tag the image
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ steps.owner.outputs.name }}/pretzelgraph-${{ matrix.role }}"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:${{ steps.version.outputs.value }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  # Forks build images too, but only the upstream repository has a deployment to notify.
  notify:
    needs: publish
    if: github.repository == 'RolandTeslaru/Pretzel-Graph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version this push publishes, as the manifest declares it.
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [ -n "$VERSION" ] && [ "$VERSION" != "undefined" ] || { echo "package.json declares no version" >&2; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Notify deployment pipeline
        run: |
          set -euo pipefail

          # The body of the merge commit, whatever its shape.
          DESCRIPTION=$(git log -1 --format=%b)

          PAYLOAD=$(jq -n \
            --arg sha "$SHA" \
            --arg owner "$OWNER" \
            --arg version "$VERSION" \
            --arg description "$DESCRIPTION" \
            '{event_type: "release", client_payload: {sha: $sha, owner: $owner, version: $version, description: $description}}')

          curl -sS -X POST "https://api.github.com/repos/$OWNER/PretzelCloud/dispatches" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD"
        env:
          SHA:     ${{ github.sha }}
          OWNER:   ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.value }}
